# nginx 片段：把 <站点域名>/api/ingest/ 反代到本服务
#
# 放进站点 server { ... } 块里（宝塔：网站 → 设置 → 配置文件，粘在 server 块内）。
# 这样 mod 客户端仍然只配一个 apiBaseUrl = https://shop.example.com 就能工作。
#
# 注意三个坑：
#   1. proxy_pass 末尾**不要**加 /，否则 /api/ingest/shops 会被改写成 /shops —— 验签就全挂
#   2. 必须原样转发原始请求体字节：不能开 gzip 压缩请求、不能改写 body（验签基于字节）
#   3. X-Forwarded-For 要带真实客户端 IP，后端 INGEST_ALLOWED_IPS 才按客户端 IP 生效

location /api/ingest/ {
    # 本服务只监听 127.0.0.1:3200（见 .env.example 的 HOST/PORT）
    proxy_pass http://127.0.0.1:3200;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 上报是短请求，但别让慢连接拖住 worker
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # 请求体上限要 ≥ 后端 INGEST_MAX_BODY_BYTES（默认 1 MiB），否则 413 由 nginx 先回，
    # 客户端会看到 nginx 的 HTML 错误页而不是 {"ok":false}
    client_max_body_size 2m;

    # 不要把请求体压缩/改写（验签基于原始字节）
    proxy_request_buffering on;
    proxy_set_header Accept-Encoding "";

    access_log /www/wwwlogs/shopsign-ingest.log;
}

# 运维探活（免签名）。不想暴露就删掉这一段，用内网 curl 打 127.0.0.1:3200 也行。
location = /healthz {
    proxy_pass http://127.0.0.1:3200;
    proxy_set_header Host $host;
    access_log off;
}
